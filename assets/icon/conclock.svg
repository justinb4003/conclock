<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2196F3"/>
      <stop offset="1" stop-color="#0D47A1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0A2A5E" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Tile -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Clock face -->
    <circle cx="512" cy="512" r="300" fill="#FFFFFF"/>
    <!-- Tracked time: wedge from 12 to 4 o'clock -->
    <path d="M512 512 L512 252 A260 260 0 0 1 737.17 642 Z" fill="#FFB300"/>
    <!-- Hour marks -->
    <g fill="#0D47A1">
      <rect x="500" y="228" width="24" height="56" rx="12"/>
      <rect x="500" y="740" width="24" height="56" rx="12"/>
      <rect x="228" y="500" width="56" height="24" rx="12"/>
      <rect x="740" y="500" width="56" height="24" rx="12"/>
    </g>
    <!-- Hands -->
    <g stroke="#0D47A1" stroke-linecap="round">
      <line x1="512" y1="512" x2="512" y2="318" stroke-width="40"/>
      <line x1="512" y1="512" x2="660" y2="600" stroke-width="40"/>
    </g>
    <circle cx="512" cy="512" r="36" fill="#0D47A1"/>
    <circle cx="512" cy="512" r="14" fill="#FFB300"/>
  </g>
</svg>
