name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Browser storage (IndexedDB) runs in the runner's Chrome.
      - run: flutter test --platform chrome test/web

  linux:
    needs: test
    # Oldest supported runner, so the binary works on older glibc distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev lld \
            libayatana-appindicator3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build linux --release --dart-define=RELEASE_DATE=$(git log -1 --format=%cs)
      - name: Package tarball and .deb
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf \
            dist/conclock-${VERSION}-linux-x64.tar.gz .
          tool/package_deb.sh "$VERSION" dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: conclock-linux-x64
          path: dist/*

  linux-arm64:
    needs: test
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev lld \
            libayatana-appindicator3-dev
      # flutter-action only ships x64 Linux SDKs; the git checkout fetches
      # arm64 tooling for itself.
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter build linux --release --dart-define=RELEASE_DATE=$(git log -1 --format=%cs)
      - name: Package tarball and .deb
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist
          tar -C build/linux/arm64/release/bundle -czf \
            dist/conclock-${VERSION}-linux-arm64.tar.gz .
          tool/package_deb.sh "$VERSION" dist arm64
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: conclock-linux-arm64
          path: dist/*

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Release signing key
        # Secrets aren't available to pull requests from forks; those
        # builds fall back to the debug key.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No key; debug-signed"; exit 0; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEYSTORE_PASSWORD
          EOF
      # Gradle downloads the NDK once with no retry, and Google's server
      # sometimes hands back a broken archive; fetch it here with retries.
      - name: Install Android NDK
        run: |
          NDK=$(sed -n 's/.*val ndkVersion: String = "\(.*\)".*/\1/p' \
            "$(dirname "$(dirname "$(which flutter)")")/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt")
          [ -n "$NDK" ] || { echo "NDK version not found"; exit 1; }
          echo "NDK $NDK"
          for i in 1 2 3 4 5; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" >/dev/null \
              && [ -f "$ANDROID_HOME/ndk/$NDK/source.properties" ] && exit 0
            rm -rf "$ANDROID_HOME/ndk/$NDK"
            echo "attempt $i failed; retrying"; sleep 30
          done
          exit 1
      - run: flutter build apk --release --dart-define=RELEASE_DATE=$(git log -1 --format=%cs)
      - name: Package APK
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/conclock-${VERSION}-android.apk
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: conclock-android
          path: dist/*

  windows:
    needs: test
    runs-on: windows-latest
    # Pushes and manual runs sign with Azure Artifact Signing via OIDC; the
    # Azure federated credential trusts the "signing" environment. Pull
    # requests get no environment and build unsigned.
    environment: ${{ github.event_name != 'pull_request' && 'signing' || '' }}
    permissions:
      contents: read
      id-token: write
    env:
      SIGN: ${{ github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release --dart-define=RELEASE_DATE=$(git log -1 --format=%cs)
        shell: bash
      - name: Azure login
        if: env.SIGN == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Before the MSVC runtime is copied in; Microsoft already signed those.
      - name: Sign app binaries
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\build\windows\x64\runner\Release
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          $release = Resolve-Path 'build\windows\x64\runner\Release'
          # Bundle the MSVC runtime so it runs on machines without it.
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$dll" $release
          }
          function Find-Iscc {
            Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          $iscc = Find-Iscc
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = Find-Iscc }
          New-Item -ItemType Directory -Force dist | Out-Null
          $out = Resolve-Path dist
          & $iscc "/DAppVersion=$version" "/DSourceDir=$release" "/DOutputDir=$out" windows\installer\conclock.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem dist
      - name: Sign installer
        if: env.SIGN == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: conclock-windows-x64
          path: dist/*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Universal (Apple Silicon + Intel), ad-hoc signed; not notarized.
      - run: flutter build macos --release --dart-define=RELEASE_DATE=$(git log -1 --format=%cs)
      - name: Package .dmg
        run: |
          VERSION=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          APP=build/macos/Build/Products/Release/ConClock.app
          lipo -info "$APP/Contents/MacOS/ConClock"
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          hdiutil create -volname ConClock -srcfolder "$STAGE" -ov \
            -format UDZO "dist/conclock-${VERSION}-macos.dmg"
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: conclock-macos
          path: dist/*

  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Served from https://<owner>.github.io/<repo>/
      - run: flutter build web --release --dart-define=RELEASE_DATE=$(git log -1 --format=%cs) --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    # Push a tag like v1.0.0 to publish a GitHub release with the binaries.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-arm64, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: conclock-*  # not the Pages bundle
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
